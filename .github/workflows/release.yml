name: Publish Windows release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to build and publish (v<workspace version>).
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      commit: ${{ steps.source.outputs.commit }}
      prerelease: ${{ steps.tag.outputs.prerelease }}
    steps:
      - name: Validate selected tag syntax
        id: tag
        shell: python3 {0}
        env:
          SELECTED_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          import os
          import re

          tag = os.environ['SELECTED_TAG']
          number = r'(?:0|[1-9][0-9]*)'
          identifier = r'(?:0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)'
          pattern = rf'v{number}\.{number}\.{number}(?:-({identifier}(?:\.{identifier})*))?(?:\+[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?'
          match = re.fullmatch(pattern, tag, flags=re.ASCII)
          if match is None:
              raise SystemExit('Expected a real SemVer tag v<workspace.package.version>.')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f'tag={tag}\nprerelease={str(match.group(1) is not None).lower()}\n')
      - name: Check out selected tag, not dispatch branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ steps.tag.outputs.tag }}
          persist-credentials: false
      - name: Validate workspace version and record immutable source
        id: source
        shell: python3 {0}
        env:
          SELECTED_TAG: ${{ steps.tag.outputs.tag }}
        run: |
          import os
          import pathlib
          import subprocess
          import tomllib

          version = tomllib.loads(pathlib.Path('Cargo.toml').read_text(encoding='utf-8'))['workspace']['package']['version']
          if os.environ['SELECTED_TAG'] != f'v{version}':
              raise SystemExit('Selected tag must exactly match workspace.package.version.')
          commit = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f'commit={commit}\n')

  build:
    needs: validate
    uses: ./.github/workflows/windows-build.yml
    with:
      ref: ${{ needs.validate.outputs.commit }}

  publish:
    needs: [validate, build]
    runs-on: windows-2022
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ needs.validate.outputs.tag }}
      RELEASE_COMMIT: ${{ needs.validate.outputs.commit }}
      RELEASE_PRERELEASE: ${{ needs.validate.outputs.prerelease }}
    steps:
      - name: Download immutable build artifact from this run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          merge-multiple: true
          path: release-assets
      - name: Verify checksum and publish a new release only
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = 'release-assets/cs-translator-windows-x64.zip'
          $checksum = "$archive.sha256"
          $files = @(Get-ChildItem -LiteralPath release-assets -File -Recurse)
          if ($files.Count -ne 2) { throw 'Expected exactly the ZIP and its checksum.' }
          $line = [System.IO.File]::ReadAllText((Resolve-Path -LiteralPath $checksum))
          if ($line -cnotmatch '\A([0-9a-f]{64})  cs-translator-windows-x64\.zip\n\z') {
            throw 'Invalid SHA256 manifest.'
          }
          $expected = $Matches[1]
          $actual = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -cne $expected) { throw 'Release ZIP checksum mismatch.' }
          $currentCommit = gh api "repos/$env:GH_REPO/commits/$env:RELEASE_TAG" --jq '.sha'
          if ($LASTEXITCODE -ne 0) { throw 'Cannot resolve release tag.' }
          if ($currentCommit -cne $env:RELEASE_COMMIT) { throw 'Tag moved since validation; refusing publication.' }
          $existingTags = @(gh api --paginate "repos/$env:GH_REPO/releases?per_page=100" --jq '.[].tag_name')
          if ($LASTEXITCODE -ne 0) { throw 'Cannot check existing releases.' }
          if ($existingTags -ccontains $env:RELEASE_TAG) { throw 'Release already exists; it will not be modified.' }
          $arguments = @('release', 'create', $env:RELEASE_TAG, $archive, $checksum, '--verify-tag', '--generate-notes', '--title', $env:RELEASE_TAG)
          if ($env:RELEASE_PRERELEASE -eq 'true') { $arguments += @('--prerelease', '--latest=false') }
          & gh @arguments
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed; no existing release will be overwritten.' }
