[package]
name = "cs-platform"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
anyhow.workspace = true
cs-core.workspace = true
crossbeam-channel.workspace = true
image.workspace = true
serde.workspace = true
toml.workspace = true
oar-ocr-core = { version = "=0.10.2", default-features = false, features = ["simd"] }
rayon = "=1.12.0"
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["std", "load-dynamic"] }
same-file = "=1.0.6"
libloading = "0.8"

[dev-dependencies]
tempfile = "3"

[target.'cfg(windows)'.dependencies]
wasapi = "=0.18.0"
windows-capture = "=2.0.1"
windows = { version = "=0.61.3", features = ["Graphics_Capture", "Security_Authorization_AppCapabilityAccess", "Win32_Foundation", "Win32_Globalization", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_Com", "Win32_System_Threading", "Win32_System_JobObjects", "Win32_System_Performance", "Win32_System_Registry", "Win32_System_WinRT", "Win32_Security"] }

[lints]
workspace = true
